services:
  - type: web
    name: frac-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn fracsite.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: frac-app-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: frac-app-db
    databaseName: frac_app
    user: frac_app_user
