<h1 style="color:red;">THIS IS THE JOB LIST PAGE (TEST)</h1>

<h1>Open Fractional Roles</h1>

{% for job in jobs %}
    <div>
        <h2><a href="{% url 'job_detail' job.pk %}">{{ job.title }}</a></h2>
        <p><strong>Company:</strong> {{ job.company }}</p>
        <p><strong>Budget:</strong> {{ job.budget_text }}</p>
        <p><strong>Duration:</strong> {{ job.duration_text }}</p>
    </div>
    <hr>
{% empty %}
    <p>No jobs posted yet.</p>
{% endfor %}

<p><a href="{% url 'post_job' %}">Post a new job →</a></p>
