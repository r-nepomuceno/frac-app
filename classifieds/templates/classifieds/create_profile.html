{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Executive Profile</title>
    <link rel="stylesheet" href="{% static 'frac-app.css' %}">
</head>
<body>
    <nav>
        <div class="container">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'exec_list' %}">Executives</a>
            <a href="{% url 'job_list' %}">Jobs</a>
            <a href="{% url 'create_profile' %}">Create Profile</a>
            <a href="{% url 'post_job' %}">Post Job</a>
        </div>
    </nav>

    <div class="container">
        <h1>Create Your Executive Profile</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Submit Profile</button>
            <a href="{% url 'home' %}" class="btn btn-secondary" style="margin-left: 1rem;">Cancel</a>
        </form>
    </div>
</body>
</html>
