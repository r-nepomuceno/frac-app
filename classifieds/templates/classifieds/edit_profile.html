{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="{% static 'frac-app.css' %}">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-94TQ21MWZ6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-94TQ21MWZ6');
    </script>
</head>
<body>
    <nav>
        <div class="container">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'exec_list' %}">Executives</a>
            <a href="{% url 'job_list' %}">Jobs</a>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Edit Profile: {{ profile.name }}</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Save Changes</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary" style="margin-left: 1rem;">Cancel</a>
        </form>
    </div>
</body>
</html>
