{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'frac-app.css' %}?v=4">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-94TQ21MWZ6"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-94TQ21MWZ6');
    </script>
</head>
<body>
    <nav>
        <div class="container">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'exec_list' %}">Executives</a>
            <a href="{% url 'job_list' %}">Jobs</a>
            
            {% if user.is_authenticated %}
                <!-- Logged IN: Show Dashboard and Logout -->
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <!-- Logged OUT: Show Login and Sign Up -->
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        <h1>Log In</h1>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Log In</button>
            <a href="{% url 'home' %}" class="btn btn-secondary" style="margin-left: 1rem;">Cancel</a>
        </form>

        <p style="margin-top: 2rem;">
            Don't have an account? <a href="{% url 'signup' %}">Sign up here</a>
        </p>
    </div>
</body>
</html>
